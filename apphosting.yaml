runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  # Public Firebase Web SDK configuration. These are safe to expose in browser.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "REPLACE_IN_FIREBASE_CONSOLE"
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "REPLACE_IN_FIREBASE_CONSOLE"
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "REPLACE_IN_FIREBASE_CONSOLE"
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "REPLACE_IN_FIREBASE_CONSOLE"
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "REPLACE_IN_FIREBASE_CONSOLE"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "REPLACE_IN_FIREBASE_CONSOLE"
  - variable: NODE_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME
  - variable: APP_BASE_URL
    value: "https://YOUR-APP-DOMAIN"
    availability:
      - RUNTIME
  - variable: META_GRAPH_VERSION
    value: v26.0
    availability:
      - RUNTIME
  - variable: META_OAUTH_SCOPES
    value: pages_show_list,pages_read_engagement,pages_manage_posts
    availability:
      - RUNTIME
  - variable: OPENAI_TEXT_MODEL
    value: gpt-5.6-luna
    availability:
      - RUNTIME
  - variable: OPENAI_IMAGE_MODEL
    value: gpt-image-2
    availability:
      - RUNTIME
  - variable: GEMINI_TEXT_MODEL
    value: gemini-3.1-flash
    availability:
      - RUNTIME
  - variable: GEMINI_IMAGE_MODEL
    value: gemini-3.1-flash-image
    availability:
      - RUNTIME
  - variable: ANTHROPIC_MODEL
    value: claude-sonnet-5
    availability:
      - RUNTIME
  # Create these with `firebase apphosting:secrets:set SECRET_NAME`.
  - variable: META_APP_ID
    secret: META_APP_ID
  - variable: META_APP_SECRET
    secret: META_APP_SECRET
  - variable: TOKEN_ENCRYPTION_KEY
    secret: TOKEN_ENCRYPTION_KEY
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
